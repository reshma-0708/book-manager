<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Book Manager</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    table { border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #999; padding: 6px 10px; }
    input { margin: 4px; padding: 4px; }
    #msg { color: red; }
  </style>
</head>
<body>
  <h1>Book Manager</h1>

  <form id="bookForm">
    <input id="title" placeholder="Title" required>
    <input id="author" placeholder="Author" required>
    <input id="isbn" placeholder="ISBN" required>
    <input id="price" type="number" step="0.01" placeholder="Price" required>
    <input id="year" type="number" placeholder="Year" required>
    <button type="submit">Add Book</button>
  </form>
  <p id="msg"></p>

  <table>
    <thead>
      <tr><th>ID</th><th>Title</th><th>Author</th><th>ISBN</th><th>Price</th><th>Year</th><th>Action</th></tr>
    </thead>
    <tbody id="bookTable"></tbody>
  </table>

  <script>
    const API = "http://127.0.0.1:8000/api/books/";

    async function loadBooks() {
      const res = await fetch(API);
      const books = await res.json();
      const table = document.getElementById("bookTable");
      table.innerHTML = "";
      books.forEach(b => {
        table.innerHTML += `
          <tr>
            <td>${b.id}</td><td>${b.title}</td><td>${b.author}</td>
            <td>${b.isbn}</td><td>${b.price}</td><td>${b.published_year}</td>
            <td><button onclick="deleteBook(${b.id})">Delete</button></td>
          </tr>`;
      });
    }

    document.getElementById("bookForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        isbn: document.getElementById("isbn").value,
        price: document.getElementById("price").value,
        published_year: document.getElementById("year").value,
        available: true
      };
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      if (res.ok) {
        document.getElementById("msg").textContent = "";
        e.target.reset();
        loadBooks();
      } else {
        const err = await res.json();
        document.getElementById("msg").textContent = JSON.stringify(err);
      }
    });

    async function deleteBook(id) {
      await fetch(API + id + "/", { method: "DELETE" });
      loadBooks();
    }

    loadBooks();
  </script>
</body>
</html>
